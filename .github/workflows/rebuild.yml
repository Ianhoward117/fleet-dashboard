name: daily-refresh

# Two jobs in one pass:
#   1. record today's fleet counts into history/ and commit them
#   2. make Netlify rebuild, so the published page picks that history up
#
# The dashboard build itself still runs on Netlify. This workflow only
# captures the trend record and pokes the build hook.
#
# 11:00 UTC is 06:00 CDT / 05:00 CST, so the refresh lands before the working
# day in Austin all year round without needing a DST-aware schedule.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: # lets you force a refresh from the Actions tab

# Needed to commit the daily history record back to the repository.
permissions:
  contents: write

# Never let two refreshes race each other onto the same history file.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Record history and trigger Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # As of v2 fetch.js also reads the Particle device list, so this step
      # needs the same token Netlify uses. GitHub masks secrets in logs, and
      # fetch.js fails loudly with a scope-aware message if it is absent or
      # rejected - it never echoes the value.
      - name: Fetch sheets and normalize
        env:
          PARTICLE_TOKEN: ${{ secrets.PARTICLE_TOKEN }}
        run: |
          if [ -z "${PARTICLE_TOKEN:-}" ]; then
            echo "::error::PARTICLE_TOKEN is not set. Add it under" \
                 "Settings > Secrets and variables > Actions. Heartbeats come" \
                 "from the Particle API as of v2, so the refresh cannot run without it."
            exit 1
          fi
          node fetch.js
          node normalize.js

      - name: Record today's counts
        run: node snapshot.js

      # Captured before anything triggers a build, so the check afterwards can
      # require a strictly newer timestamp rather than just a recent one.
      - name: Note the currently published build
        id: before
        run: echo "builtAt=$(node verify-live.js --current)" >> "$GITHUB_OUTPUT"

      - name: Commit history if it changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No history change - nothing to commit."
          else
            git commit -m "Record fleet counts for $(date -u +%Y-%m-%d)

          Automated daily snapshot from the scheduled refresh."
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed and pushed today's history record."
          fi

      # Pushing above already triggers a Netlify build. Only poke the hook
      # when nothing was pushed, so a normal day produces one build, not two.
      - name: Trigger Netlify build
        if: steps.commit.outputs.changed != 'true'
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          set -euo pipefail

          if [ -z "${HOOK_URL:-}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK is not set. Add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Only the status code is captured; the hook URL is never echoed.
          status=$(curl --silent --show-error \
                        --request POST --data '{}' \
                        --output /dev/null --write-out '%{http_code}' \
                        "$HOOK_URL") || true

          echo "Netlify responded with HTTP $status"

          case "$status" in
            2*) echo "Build triggered. Watch it in the Netlify deploys tab." ;;
            "") echo "::error::No response from Netlify."; exit 1 ;;
            *)  echo "::error::Build hook returned HTTP $status. If this is 404," \
                     "the hook was deleted or the secret holds a stale URL."
                exit 1 ;;
          esac

      - name: Note the push-triggered build
        if: steps.commit.outputs.changed == 'true'
        run: echo "History was pushed; Netlify rebuilds from that commit automatically."

      # The point of the whole workflow is that the published page got newer.
      # Without this, a Netlify build that fails leaves yesterday's page up and
      # the refresh looks successful from here. Failing the workflow is what
      # turns that silent staleness into a notification.
      - name: Verify the live site actually refreshed
        env:
          VERIFY_NEWER_THAN: ${{ steps.before.outputs.builtAt }}
        run: node verify-live.js
